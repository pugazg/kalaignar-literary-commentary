name: Kuraloviyam Part 003 SC3 control sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-sc3.yml'

permissions:
  contents: write

jobs:
  sync-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize SC3 frontier controls
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kuraloviyam-part003-sc3-controls.py
          git add works/kuraloviyam/translations/en/TRANSLATION_STATUS.md works/kuraloviyam/translations/en/README.md works/kuraloviyam/HANDOVER.md NEXT_CHAT_PROMPT_KURALOVIYAM.md
          git commit -m 'kuraloviyam: Record Part 003 English source-check SC3'
          git push origin main
