name: Kuraloviyam Part 003 English GR1 completion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-gr1-complete.yml'

permissions:
  contents: write

jobs:
  complete-gr1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Complete GR1 and synchronize controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kuraloviyam-part003-gr1-complete.py
          git add HANDOVER.md NEXT_CHAT_PROMPT_KURALOVIYAM.md \
            works/kuraloviyam/HANDOVER.md works/kuraloviyam/README.md \
            works/kuraloviyam/indexes/page-map.md works/kuraloviyam/metadata/source.md \
            works/kuraloviyam/translations/en/GLOSSARY.md \
            works/kuraloviyam/translations/en/README.md \
            works/kuraloviyam/translations/en/TRANSLATION_STATUS.md
          git commit -m 'kuraloviyam: Complete Part 003 English glossary reconciliation GR1'
          git push origin main
