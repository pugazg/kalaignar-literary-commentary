name: Kuraloviyam Part 003 ER1 page-map sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-er1-pagemap-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize page-map frontier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('works/kuraloviyam/indexes/page-map.md')
          s=p.read_text(encoding='utf-8')
          old='**Tamil ARCHIVAL-READY / CLOSED; English drafting + source-check + glossary reconciliation COMPLETE / CLOSED — 111/111; editorial review ER1 next**'
          new='**Tamil ARCHIVAL-READY / CLOSED; English drafting + source-check + glossary reconciliation COMPLETE / CLOSED — 111/111; editorial review ER1 COMPLETE / PASS — 33/111; ER2 next**'
          if s.count(old)!=1:
              raise SystemExit(f'expected one stale Part003 page-map state, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git add works/kuraloviyam/indexes/page-map.md
          git commit -m 'kuraloviyam: Synchronize ER1 page-map frontier'
          git push origin main
