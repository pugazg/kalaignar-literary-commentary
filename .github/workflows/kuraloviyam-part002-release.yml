name: Kuraloviyam Part 002 release promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kuraloviyam-part002-release.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote remaining Part 002 English pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('works/kuraloviyam/translations/en/pages')

          # Verify the already completed portion before touching the remainder.
          for scan in range(112, 159):
              printed = scan - 17
              p = root / f'{scan:04d}-kuraloviyam-{printed}.md'
              text = p.read_text(encoding='utf-8')
              if 'status: "release-ready"' not in text:
                  raise SystemExit(f'Expected release-ready before scan 159: {p}')
              if 'status: "editorial-reviewed"' in text:
                  raise SystemExit(f'Unexpected editorial-reviewed in released range: {p}')

          changed = []
          for scan in range(159, 223):
              printed = scan - 17
              p = root / f'{scan:04d}-kuraloviyam-{printed}.md'
              text = p.read_text(encoding='utf-8')
              old = 'status: "editorial-reviewed"'
              new = 'status: "release-ready"'
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one editorial-reviewed status in {p}, found {text.count(old)}')
              replaced = text.replace(old, new, 1)
              # Safety gate: release promotion may change only the exact status token.
              if replaced.replace(new, old, 1) != text:
                  raise SystemExit(f'Unexpected mutation while promoting {p}')
              p.write_text(replaced, encoding='utf-8')
              changed.append(p)

          # Final full-Part status assertion.
          for scan in range(112, 223):
              printed = scan - 17
              p = root / f'{scan:04d}-kuraloviyam-{printed}.md'
              text = p.read_text(encoding='utf-8')
              if text.count('status: "release-ready"') != 1:
                  raise SystemExit(f'Final release-ready assertion failed: {p}')
              for forbidden in ('status: "editorial-reviewed"', 'status: "source-checked"', 'status: "draft"', 'status: "source-limited"', 'status: "blocked"'):
                  if forbidden in text:
                      raise SystemExit(f'Forbidden final status {forbidden} in {p}')

          print(f'Promoted {len(changed)} remaining page records; Part 002 now 111/111 release-ready.')
          PY
      - name: Commit promotion and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'pugazg'
          git config user.email 'w46v654vvn@privaterelay.appleid.com'
          rm .github/workflows/kuraloviyam-part002-release.yml
          git add works/kuraloviyam/translations/en/pages .github/workflows/kuraloviyam-part002-release.yml
          git diff --cached --check
          git commit -m 'kuraloviyam: Release remaining Part 002 English pages'
          git push origin HEAD:main
