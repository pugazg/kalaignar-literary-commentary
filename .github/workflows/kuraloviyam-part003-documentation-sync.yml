name: Kuraloviyam Part 003 documentation sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kuraloviyam-part003-documentation-sync.yml
      - .github/scripts/kuraloviyam_part003_documentation_sync.py

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize Part 003 control documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python .github/scripts/kuraloviyam_part003_documentation_sync.py
          git config user.name "pugazg"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOVER.md KURALOVIYAM_ARCHIVAL_GUIDELINES.md NEXT_CHAT_PROMPT_KURALOVIYAM.md works/kuraloviyam/HANDOVER.md works/kuraloviyam/PART_003_DOCUMENTATION_SYNC.md works/kuraloviyam/README.md works/kuraloviyam/indexes/page-map.md works/kuraloviyam/metadata/source.md works/kuraloviyam/metadata/transcription-policy.md
          git diff --cached --check
          git commit -m "kuraloviyam: Complete Part 003 documentation sync"
          git push origin HEAD:main
