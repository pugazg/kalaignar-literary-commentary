name: Kuraloviyam Part 003 documentation sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kuraloviyam-part003-documentation-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize Part 003 control documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          START_HEAD=$(git rev-parse HEAD)

          python - <<'PY'
          from pathlib import Path

          expected_source = 'source_filename: "TVA_BOK_0065733_குறளோவியம்_part_003_pages_223-333.pdf"'
          root = Path('works/kuraloviyam/pages')
          for scan in range(223, 334):
              printed = scan - 17
              path = root / f'{scan:04d}-kuraloviyam-{printed}.md'
              if not path.is_file():
                  raise SystemExit(f'missing Part 003 page record: {path}')
              text = path.read_text(encoding='utf-8')
              required = [
                  f'scan_page: {scan}',
                  'part: 3',
                  f'part_page: {scan-222}',
                  f'printed_page: "{printed}"',
                  'status: "verified"',
                  'visual_fidelity: "verified"',
                  expected_source,
              ]
              for needle in required:
                  if text.count(needle) != 1:
                      raise SystemExit(f'{path}: expected exactly one {needle!r}')
              if 'status: "needs-review"' in text or 'visual_fidelity: "needs-review"' in text:
                  raise SystemExit(f'{path}: stale status found before documentation sync')

          audit = Path('works/kuraloviyam/PART_003_AUDIT.md').read_text(encoding='utf-8')
          sync = Path('works/kuraloviyam/PART_003_FINAL_STATUS_SYNC.md').read_text(encoding='utf-8')
          if 'Status: **PASS**' not in audit:
              raise SystemExit('Part 003 audit is not PASS')
          if '**FINAL METADATA / STATUS SYNCHRONIZATION — PASS / CLOSED**' not in sync:
              raise SystemExit('Part 003 final status sync is not PASS / CLOSED')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_tail(path, marker, new_tail):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: expected one tail marker, found {count}: {marker!r}')
              idx = text.index(marker)
              p.write_text(text[:idx] + new_tail.rstrip() + '\n', encoding='utf-8')

          startup_old_meta = '''16. `works/kuraloviyam/PART_003_FINAL_STATUS_SYNC.md`
17. `works/kuraloviyam/PART_002_FINAL_STATUS_SYNC.md` as metadata-sync precedent
18. `works/kuraloviyam/PART_002_TAMIL_ARCHIVAL_READY.md`
19. `works/kuraloviyam/translations/en/TRANSLATION_STATUS.md`
20. `works/kuraloviyam/translations/en/reviews/PART_002_ENGLISH_RELEASE_REPORT.md`'''
          startup_new_meta = '''16. `works/kuraloviyam/PART_003_FINAL_STATUS_SYNC.md`
17. `works/kuraloviyam/PART_003_DOCUMENTATION_SYNC.md`
18. `works/kuraloviyam/PART_002_FINAL_STATUS_SYNC.md` as metadata-sync precedent
19. `works/kuraloviyam/PART_002_TAMIL_ARCHIVAL_READY.md` as archival-ready precedent
20. `works/kuraloviyam/translations/en/TRANSLATION_STATUS.md`
21. `works/kuraloviyam/translations/en/reviews/PART_002_ENGLISH_RELEASE_REPORT.md`'''

