name: Kuraloviyam Part 003 English SC2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kuraloviyam-part003-sc2.yml

permissions:
  contents: write

jobs:
  run-sc2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply SC2 page changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('works/kuraloviyam/translations/en/pages')
          expected = set()
          for scan in range(256, 289):
              printed = scan - 17
              p = root / f'{scan:04d}-kuraloviyam-{printed}.md'
              text = p.read_text(encoding='utf-8')
              assert f'source_scan_page: {scan}' in text, p
              assert f'printed_page: "{printed}"' in text, p
              assert 'source_tamil_status: "verified"' in text, p
              assert 'status: "draft"' in text, p
              text = text.replace('status: "draft"', 'status: "source-checked"', 1)
              p.write_text(text, encoding='utf-8')
              expected.add(str(p))

          needle = 'translation_basis: "audited Tamil archival record; controlling scan remains ultimate source authority"\n---\n\n'
          addition = '## Visual material\n\nSmall red decorative monument below the Chapter/Kural metadata in the source page.\n\n'
          for name in ('0257-kuraloviyam-240.md', '0267-kuraloviyam-250.md', '0277-kuraloviyam-260.md'):
              p = root / name
              text = p.read_text(encoding='utf-8')
              assert '## Visual material' not in text, p
              assert needle in text, p
              text = text.replace(needle, needle + addition, 1)
              p.write_text(text, encoding='utf-8')

          p = root / '0274-kuraloviyam-257.md'
          text = p.read_text(encoding='utf-8')
          old = "“Could that prove false? Into the enemy's stronghold that was entered stealthily in the darkness, he is coming with the flag of victory rising to touch the sky—"
          new = "“Could that prove false? Having entered the enemy's stronghold stealthily in the darkness, he is now returning with the flag of victory rising to touch the sky—"
          assert old in text, p
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, sorted(changed ^ expected)
          for scan in range(256, 289):
              p = root / f'{scan:04d}-kuraloviyam-{scan-17}.md'
              text = p.read_text(encoding='utf-8')
              assert text.count('status: "source-checked"') == 1, p
              assert 'status: "draft"' not in text, p
              assert text.count('source_tamil_status: "verified"') == 1, p
          PY
          git add works/kuraloviyam/translations/en/pages
          git commit -m 'kuraloviyam: Source-check Part 003 English scans 256-288'
          git push origin main
