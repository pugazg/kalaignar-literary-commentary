name: Kuraloviyam Part 003 SC2 control sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kuraloviyam-part003-sc2.yml

permissions:
  contents: write

jobs:
  sync-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run control synchronization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kuraloviyam-part003-sc2-controls.py
          git add NEXT_CHAT_PROMPT_KURALOVIYAM.md works/kuraloviyam/HANDOVER.md works/kuraloviyam/translations/en/README.md works/kuraloviyam/translations/en/TRANSLATION_STATUS.md
          git commit -m 'kuraloviyam: Record Part 003 English source-check SC2'
          git push origin main
