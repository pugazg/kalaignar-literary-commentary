Part 004 remains blocked until Part 003 completes the maintained English workflow and final Part closure checkpoint.'''
          s2, n = re.subn(pattern, repl, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'NEXT prompt frontier replacement count={n}')
          p.write_text(s2, encoding='utf-8')
          PY

          python3 - <<'PY'
          import subprocess
          expected = {
            'NEXT_CHAT_PROMPT_KURALOVIYAM.md',
            'works/kuraloviyam/HANDOVER.md',
            'works/kuraloviyam/translations/en/README.md',
            'works/kuraloviyam/translations/en/TRANSLATION_STATUS.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'control changed-file audit failed: {sorted(changed ^ expected)}')
          PY

          git add NEXT_CHAT_PROMPT_KURALOVIYAM.md works/kuraloviyam/HANDOVER.md works/kuraloviyam/translations/en/README.md works/kuraloviyam/translations/en/TRANSLATION_STATUS.md
          git commit -m 'kuraloviyam: Record Part 003 English source-check SC2'
          git push origin main
