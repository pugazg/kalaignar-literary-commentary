name: Kuraloviyam Part 003 English SC4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-sc4.yml'

permissions:
  contents: write

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run SC4 and synchronize controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kuraloviyam-part003-sc4.py
