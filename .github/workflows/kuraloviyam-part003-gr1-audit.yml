name: Kuraloviyam Part 003 English GR1 audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-gr1-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Audit GR1 terminology
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kuraloviyam-part003-gr1-audit.py
          git add .github/tmp/kuraloviyam-part003-gr1-audit.txt .github/tmp/kuraloviyam-part003-gr1-findings.txt
          git commit -m 'chore: refresh final Kuraloviyam GR1 audit report'
          git push origin main
