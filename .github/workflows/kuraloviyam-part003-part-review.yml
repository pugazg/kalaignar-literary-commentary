name: Kuraloviyam Part 003 English Part review

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-part-review.yml'

permissions:
  contents: write

jobs:
  part-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Part 003 whole-Part English review
        run: python .github/scripts/kuraloviyam-part003-part-review.py

      - name: Verify and commit durable Part-review record and controls
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 10 ]]; then
            printf 'Expected 10 durable changed files, found %s\n' "${#changed[@]}"
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          if printf '%s\n' "${changed[@]}" | grep -q '^works/kuraloviyam/pages/'; then
            echo 'Tamil page change detected'
            exit 1
          fi
          if printf '%s\n' "${changed[@]}" | grep -q '^works/kuraloviyam/translations/en/pages/'; then
            echo 'English page change detected during Part-level review'
            exit 1
          fi
          if printf '%s\n' "${changed[@]}" | grep -q '^\.github/'; then
            echo 'Unexpected temporary-file working-tree change detected'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            HANDOVER.md \
            KURALOVIYAM_ARCHIVAL_GUIDELINES.md \
            NEXT_CHAT_PROMPT_KURALOVIYAM.md \
            works/kuraloviyam/HANDOVER.md \
            works/kuraloviyam/README.md \
            works/kuraloviyam/indexes/page-map.md \
            works/kuraloviyam/metadata/source.md \
            works/kuraloviyam/translations/en/README.md \
            works/kuraloviyam/translations/en/TRANSLATION_STATUS.md \
            works/kuraloviyam/translations/en/reviews/PART_003_ENGLISH_REVIEW.md

          staged_count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          if [[ "$staged_count" != '10' ]]; then
            echo "Expected 10 staged files, found $staged_count"
            git diff --cached --name-only
            exit 1
          fi

          git commit -m 'kuraloviyam: Pass Part 003 whole-Part English review'
          git push origin HEAD:main
