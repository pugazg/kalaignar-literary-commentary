name: Kuraloviyam Part 003 SC1 control sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kuraloviyam-part003-sc1-docsync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync controls
        run: python3 .github/scripts/kuraloviyam-part003-sc1-control-sync.py
      - name: Commit controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEXT_CHAT_PROMPT_KURALOVIYAM.md works/kuraloviyam/HANDOVER.md works/kuraloviyam/translations/en/README.md works/kuraloviyam/translations/en/TRANSLATION_STATUS.md
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m "kuraloviyam: Record Part 003 English source-check SC1"
          git push origin HEAD:main
