9. preserve the CLEAN incoming **255→256** boundary and inspect the genuine outgoing **288→289** continuation without treating it as a narrative break;
10. do not alter Tamil files;
11. do not begin glossary reconciliation or editorial review during SC2;
12. update `translations/en/TRANSLATION_STATUS.md` and audit the exact changed-file set.

If SC2 passes, source-check becomes **66/111** and SC3 will be **scans 289–321 / printed 272–304 — 33 pages**.'''
          if old not in handover:
              raise SystemExit('HANDOVER SC1 block not found')
          handover = handover.replace(old, new, 1)
          handover_path.write_text(handover, encoding='utf-8')

          prompt_path = Path('NEXT_CHAT_PROMPT_KURALOVIYAM.md')
          prompt = prompt_path.read_text(encoding='utf-8')
          prompt = prompt.replace(
              '- current Part-003 English state: **111 `draft` / 0 source-limited / 0 blocked**.\n- remaining undrafted pages: **0**.\n- Part 003 English source-check / glossary reconciliation / editorial review / Part review / release: **not-started**.',
              '- Part 003 English source-check SC1: **COMPLETE 33/33 — scans 223–255 / printed 206–238**.\n- cumulative source-check: **33/111**.\n- current Part-003 English state: **33 `source-checked` + 78 `draft` / 0 source-limited / 0 blocked**.\n- remaining undrafted pages: **0**.\n- glossary reconciliation / editorial review / Part review / release: **not-started**.',
              1,
          )
          old = '''## Exact next activity — Part 003 English Source-check SC1

Process **scans 223–255 / printed 206–238 — 33 page-aligned records**.

Requirements:

1. fetch live `main` first and preserve newer durable work;
2. confirm `PART_003_TAMIL_ARCHIVAL_READY.md` remains **PASS / CLOSED**;
3. confirm `translations/en/TRANSLATION_STATUS.md` records Part-003 first-pass drafting **111/111 COMPLETE**;
