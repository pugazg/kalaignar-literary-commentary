name: Kuraloviyam Part 003 GR4 status postfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kuraloviyam-part003-gr4-status-postfix.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync translation status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/kuraloviyam-part003-gr4-status-postfix.py
          git add works/kuraloviyam/translations/en/TRANSLATION_STATUS.md
          git commit -m 'kuraloviyam: Synchronize GR4 translation status summary'
          git push origin main
